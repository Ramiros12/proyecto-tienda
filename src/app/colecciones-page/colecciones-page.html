<div class="main-container">
    <!-- Encabezado -->
    <header class="page-header">
        <!-- Flecha izquierda existente -->
        <button class="nav-arrow" [routerLink]="prevRoute"> < </button> 
      
        <div class="logo-container">
          <!-- Añadimos el routerLink aquí -->
          <h2 class="brand-title clickable-logo" routerLink="/">
            STREET<span>WANE</span>
          </h2>
          <p class="section-name">{{ pageTitle }}</p>
        </div>
      
        <!-- Flecha derecha existente -->
        <button class="nav-arrow" [routerLink]="nextRoute"> > </button>
      </header>
  
    <div class="divider"></div>
  
    <!-- Contenedor Principal de Lookbook -->
    <main class="lookbook-container">
      
      <!-- Panel Izquierdo: Estilo Urbano -->
      <article class="panel panel-dark">
        <h3 class="panel-title cyan">ESTILO URBANO</h3>
        <div class="image-placeholder main-img">
          <!-- Aquí iría la imagen del modelo con la chaqueta verde -->
          <img src="assets/estilo-urbano.jpg" alt="Estilo Urbano">
        </div>
        <p class="panel-description">
          Explora la esencia de la calle con nuestra selección premium. 
          Diseños pensados para quienes no piden permiso.
        </p>
        <button class="btn-yellow-glow">MÁS INFO</button>
        <div class="arrow-indicator">∨</div>
      </article>
  
      <!-- Panel Derecho: Colecciones Anteriores -->
      <article class="panel panel-light">
        <h3 class="panel-title yellow">COLECCIONES ANTERIOR</h3>
        <p class="panel-description top-text">
          Revive los drops que marcaron tendencia. Un repaso por la evolución 
          constante de nuestra marca en la escena local.
        </p>
        <div class="image-placeholder sketch-img">
          <!-- Aquí iría la imagen de los bocetos de moda -->
          <img src="assets/sketches.jpg" alt="Bocetos">
        </div>
        <button class="btn-yellow-glow">MÁS INFO</button>
      </article>
  
    </main>
  
    <!-- Botonera Inferior -->
    <footer class="bottom-nav">
      <button class="btn-footer yellow-bg">💡 IDEAS OUTFIT</button>
      <button class="btn-footer dark-bg">🔍 EJEMPLOS</button>
      <button class="btn-footer light-bg">🏢 LA ACTUALIDAD</button>
    </footer>
  </div>
